[tool.poetry]
name = "marketplace"
version = "0.1.0"
description = "Marketplace API (OpenAPI contract-first, FastAPI, SQLAlchemy, Alembic)"
authors = ["Kera <keramine750@gmail.com>"]
readme = "README.md"
packages = [
  { include = "app", from = "src" },
  { include = "impl", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
fastapi = "^0.119.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }

sqlalchemy = "^2.0.30"
alembic = "^1.13.2"
psycopg = { extras = ["binary"], version = "^3.2.0" }

python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }

pydantic-settings = "^2.3.0"
structlog = "^24.2.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.7"
httpx = "^0.27.0"
ruff = "^0.6.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "generated/src"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"