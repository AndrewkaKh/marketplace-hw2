services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  generator:
    image: openapitools/openapi-generator-cli:latest
    working_dir: /local
    volumes:
      - ./:/local
    command:
      [
        "generate",
        "-i",
        "/local/openapi/marketplace.yaml",
        "-g",
        "python-fastapi",
        "-o",
        "/local/generated",
        "--additional-properties=packageName=marketplace_gen,sourceFolder=src,fastapiImplementationPackage=impl"
      ]

  app:
    build: .
    depends_on:
      - db
      - generator
    environment:
      DATABASE_URL: postgresql+psycopg://marketplace:marketplace@db:5432/marketplace
      JWT_SECRET: "dev-secret-change-me"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_MINUTES: "20"
      REFRESH_TOKEN_DAYS: "14"
      ORDER_RATE_LIMIT_MINUTES: "5"
      PYTHONPATH: "/app/src:/app/generated/src"
    ports:
      - "8080:8080"
    volumes:
      - ./:/app

volumes:
  pgdata: