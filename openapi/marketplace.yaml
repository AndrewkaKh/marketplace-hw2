openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.0.0

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Products
  - name: Orders
  - name: PromoCodes

paths:
  /auth/register:
    post:
      tags: [Auth]
      security: []
      operationId: register
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Auth]
      security: []
      operationId: login
      summary: Login and get access+refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Tokens
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Invalid credentials
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_credentials:
                  value:
                    error_code: TOKEN_INVALID
                    message: Invalid credentials
                    details: null

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      operationId: refreshToken
      summary: Refresh access token by refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New access token
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Refresh token invalid
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                refresh_invalid:
                  value:
                    error_code: REFRESH_TOKEN_INVALID
                    message: Refresh token invalid
                    details: null

  /products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List products with pagination and filters
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - in: query
          name: size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - in: query
          name: status
          required: false
          schema:
            $ref: '#/components/schemas/ProductStatus'
        - in: query
          name: category
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Page
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPageResponse'
        '401':
          $ref: '#/components/responses/AuthError'

    post:
      tags: [Products]
      operationId: createProduct
      summary: Create product
      description: |
        Roles:
          - SELLER: only own products (seller_id = current user)
          - ADMIN: any
      x-roles: [SELLER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AccessDenied'

  /products/{id}:
    get:
      tags: [Products]
      operationId: getProductById
      summary: Get product by id
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Found
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/AuthError'
        '404':
          description: Not found
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                product_not_found:
                  value:
                    error_code: PRODUCT_NOT_FOUND
                    message: Product not found
                    details: null

    put:
      tags: [Products]
      operationId: updateProduct
      summary: Update product
      description: |
        Roles:
          - SELLER: only own products
          - ADMIN: any
      x-roles: [SELLER, ADMIN]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Updated
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          description: Not found
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                product_not_found:
                  value:
                    error_code: PRODUCT_NOT_FOUND
                    message: Product not found
                    details: null

    delete:
      tags: [Products]
      operationId: archiveProduct
      summary: Soft delete product (status=ARCHIVED)
      description: |
        Soft delete: переводим товар в ARCHIVED, физически не удаляем.
        Roles:
          - SELLER: only own products
          - ADMIN: any
      x-roles: [SELLER, ADMIN]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Archived
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          description: Not found
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                product_not_found:
                  value:
                    error_code: PRODUCT_NOT_FOUND
                    message: Product not found
                    details: null

  /orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create order (stock reservation, promo, rate-limit)
      description: |
        Roles:
          - USER: allowed
          - ADMIN: allowed
          - SELLER: forbidden
        Business rules:
          - ORDER_LIMIT_EXCEEDED (429)
          - ORDER_HAS_ACTIVE (409)
          - PRODUCT_NOT_FOUND (404)
          - PRODUCT_INACTIVE (409)
          - INSUFFICIENT_STOCK (409, details: list)
          - PROMO_CODE_INVALID (422)
          - PROMO_CODE_MIN_AMOUNT (422)
      x-roles: [USER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AccessDenied'
        '404':
          description: Product not found
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Business conflict
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/InsufficientStockError'
              examples:
                order_has_active:
                  value:
                    error_code: ORDER_HAS_ACTIVE
                    message: User already has active order
                    details: null
                product_inactive:
                  value:
                    error_code: PRODUCT_INACTIVE
                    message: Product is inactive
                    details: null
                insufficient_stock:
                  value:
                    error_code: INSUFFICIENT_STOCK
                    message: Insufficient stock
                    details:
                      items:
                        - product_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                          requested: 5
                          available: 2
        '422':
          description: Promo code validation
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrderById
      summary: Get order by id
      description: |
        Roles:
          - USER: only own order (else ORDER_OWNERSHIP_VIOLATION 403)
          - ADMIN: any
      x-roles: [USER, ADMIN]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Found
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          description: Access denied or ownership violation
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ownership_violation:
                  value:
                    error_code: ORDER_OWNERSHIP_VIOLATION
                    message: Order belongs to another user
                    details: null
                access_denied:
                  value:
                    error_code: ACCESS_DENIED
                    message: Access denied
                    details: null
        '404':
          description: Order not found
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                order_not_found:
                  value:
                    error_code: ORDER_NOT_FOUND
                    message: Order not found
                    details: null

    put:
      tags: [Orders]
      operationId: updateOrder
      summary: Update order items (allowed only in CREATED)
      description: |
        Roles:
          - USER: only own order
          - ADMIN: any
        Rules:
          - only status CREATED (else INVALID_STATE_TRANSITION 409)
          - UPDATE_ORDER rate limit (429)
          - catalog/stock checks (PRODUCT_NOT_FOUND/PRODUCT_INACTIVE/INSUFFICIENT_STOCK)
          - all in one transaction
      x-roles: [USER, ADMIN]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdateRequest'
      responses:
        '200':
          description: Updated
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          description: Access denied or ownership violation
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order or product not found
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Business conflict
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/InsufficientStockError'
        '429':
          description: Rate limit exceeded
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Promo re-check errors (if promo applied)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{id}/cancel:
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel order (only CREATED or PAYMENT_PENDING)
      description: |
        Roles:
          - USER: only own order
          - ADMIN: any
        Rules:
          - allowed only from CREATED, PAYMENT_PENDING (else INVALID_STATE_TRANSITION 409)
          - returns stock, decrements promo usage if applied
          - all in one transaction
      x-roles: [USER, ADMIN]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Canceled
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          description: Access denied or ownership violation
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Invalid state transition
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_state:
                  value:
                    error_code: INVALID_STATE_TRANSITION
                    message: Cancel not allowed from current state
                    details: null

  /promo-codes:
    post:
      tags: [PromoCodes]
      operationId: createPromoCode
      summary: Create promo code
      description: |
        Roles:
          - SELLER: allowed
          - ADMIN: allowed
          - USER: forbidden
      x-roles: [SELLER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCodeCreate'
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthError'
        '403':
          $ref: '#/components/responses/AccessDenied'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    XRequestId:
      description: Request id (UUID) generated per request
      schema:
        type: string
        format: uuid

  parameters:
    ProductId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid

    OrderId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid

  responses:
    AuthError:
      description: Unauthorized (TOKEN_INVALID / TOKEN_EXPIRED)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            token_expired:
              value:
                error_code: TOKEN_EXPIRED
                message: Access token expired
                details: null
            token_invalid:
              value:
                error_code: TOKEN_INVALID
                message: Access token invalid
                details: null

    AccessDenied:
      description: Forbidden (ACCESS_DENIED)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            denied:
              value:
                error_code: ACCESS_DENIED
                message: Access denied
                details: null

    ValidationError:
      description: Validation error (VALIDATION_ERROR)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          examples:
            validation_failed:
              value:
                error_code: VALIDATION_ERROR
                message: Validation failed
                details:
                  violations:
                    - field: name
                      rule: minLength
                      message: Must be at least 1 character
                    - field: price
                      rule: minimum
                      message: Must be >= 0.01

  schemas:
    ErrorCode:
      type: string
      enum:
        - PRODUCT_NOT_FOUND
        - PRODUCT_INACTIVE
        - ORDER_NOT_FOUND
        - ORDER_LIMIT_EXCEEDED
        - ORDER_HAS_ACTIVE
        - INVALID_STATE_TRANSITION
        - INSUFFICIENT_STOCK
        - PROMO_CODE_INVALID
        - PROMO_CODE_MIN_AMOUNT
        - ORDER_OWNERSHIP_VIOLATION
        - VALIDATION_ERROR
        - TOKEN_EXPIRED
        - TOKEN_INVALID
        - REFRESH_TOKEN_INVALID
        - ACCESS_DENIED

    ErrorResponse:
      type: object
      required: [error_code, message]
      properties:
        error_code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        details:
          type: object
          nullable: true

    FieldViolation:
      type: object
      required: [field, rule, message]
      properties:
        field:
          type: string
        rule:
          type: string
        message:
          type: string

    ValidationErrorDetails:
      type: object
      required: [violations]
      properties:
        violations:
          type: array
          items:
            $ref: '#/components/schemas/FieldViolation'

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            details:
              $ref: '#/components/schemas/ValidationErrorDetails'

    InsufficientStockItem:
      type: object
      required: [product_id, requested, available]
      properties:
        product_id:
          type: string
          format: uuid
        requested:
          type: integer
          minimum: 1
        available:
          type: integer
          minimum: 0

    InsufficientStockDetails:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InsufficientStockItem'

    InsufficientStockError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            details:
              $ref: '#/components/schemas/InsufficientStockDetails'

    Role:
      type: string
      enum: [USER, SELLER, ADMIN]

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 10

    UserResponse:
      type: object
      required: [id, email, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        created_at:
          type: string
          format: date-time

    AuthTokensResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: seconds until access token expires

    AccessTokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer

    ProductStatus:
      type: string
      enum: [ACTIVE, INACTIVE, ARCHIVED]

    Money:
      type: number
      format: decimal
      minimum: 0
      multipleOf: 0.01

    ProductCreate:
      type: object
      required: [name, price, stock, category, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 4000
          nullable: true
        price:
          allOf:
            - $ref: '#/components/schemas/Money'
          minimum: 0.01
        stock:
          type: integer
          minimum: 0
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'

    ProductUpdate:
      type: object
      required: [name, price, stock, category, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 4000
          nullable: true
        price:
          allOf:
            - $ref: '#/components/schemas/Money'
          minimum: 0.01
        stock:
          type: integer
          minimum: 0
        category:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/ProductStatus'

    ProductResponse:
      type: object
      required: [id, name, price, stock, category, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          $ref: '#/components/schemas/Money'
        stock:
          type: integer
        category:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductPageResponse:
      type: object
      required: [items, totalElements, page, size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        totalElements:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1

    OrderStatus:
      type: string
      enum: [CREATED, PAYMENT_PENDING, PAID, SHIPPED, COMPLETED, CANCELED]

    OrderItemRequest:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 999

    OrderCreateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemRequest'
        promo_code:
          type: string
          nullable: true
          pattern: '^[A-Z0-9_]{4,20}$'

    OrderUpdateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemRequest'

    OrderItemResponse:
      type: object
      required: [id, product_id, quantity, price_at_order]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
        price_at_order:
          allOf:
            - $ref: '#/components/schemas/Money'
          minimum: 0.01

    OrderResponse:
      type: object
      required: [id, user_id, status, total_amount, discount_amount, items, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/OrderStatus'
        promo_code:
          type: string
          nullable: true
        total_amount:
          $ref: '#/components/schemas/Money'
        discount_amount:
          $ref: '#/components/schemas/Money'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PromoDiscountType:
      type: string
      enum: [PERCENTAGE, FIXED_AMOUNT]

    PromoCodeCreate:
      type: object
      required: [code, discount_type, discount_value, min_order_amount, max_uses, valid_from, valid_until, active]
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9_]{4,20}$'
        discount_type:
          $ref: '#/components/schemas/PromoDiscountType'
        discount_value:
          $ref: '#/components/schemas/Money'
        min_order_amount:
          $ref: '#/components/schemas/Money'
        max_uses:
          type: integer
          minimum: 1
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        active:
          type: boolean

    PromoCodeResponse:
      type: object
      required: [id, code, discount_type, discount_value, min_order_amount, max_uses, current_uses, valid_from, valid_until, active, created_at]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        discount_type:
          $ref: '#/components/schemas/PromoDiscountType'
        discount_value:
          $ref: '#/components/schemas/Money'
        min_order_amount:
          $ref: '#/components/schemas/Money'
        max_uses:
          type: integer
        current_uses:
          type: integer
          minimum: 0
        valid_from:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        active:
          type: boolean
        created_at:
          type: string
          format: date-time